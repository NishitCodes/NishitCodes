name: Update GitHub Stats

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Runs every midnight UTC
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write # Explicitly request write permissions to push to the repo

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Fetch GitHub Stats
        run: |
          curl -s -o assets/github-stats.svg "https://github-readme-stats.vercel.app/api?username=NishitCodes&theme=material-palenight"
          curl -s -o assets/top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=NishitCodes&theme=material-palenight&layout=compact"
          
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update GitHub stats"
          file_pattern: assets/*.svg
